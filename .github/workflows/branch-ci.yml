name: Branch CI

on:
  push:
    paths-ignore:
      # Workflow edits are NOT ignored: the os matrix is the only thing proving the file publishing
      # works on Windows and macOS, so a change to it has to be able to run itself.
      - '*.md'
      - '*.txt'
    branches-ignore:
      - 'release*'

jobs:
  build:
    # File publishing is platform-sensitive: on Unix an atomic move is a rename, on Windows it
    # cannot replace a file another thread holds open. All three runners are built so a change
    # that only breaks one of them is caught here.
    name: Branch CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Maven Build
        shell: bash
        run: mvn clean install -DskipTests=true -Dmaven.javadoc.skip=true -B -V
        env:
          GITHUB_TOKEN: ${{ secrets.ORGANIZATION_TOKEN }}
      - name: Maven Verify
        shell: bash
        run: mvn verify -B
